name: Build macOS 15 compatibility DMG

# Manual only: this workflow never publishes a release or runs on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode 26.3
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Build and verify ad-hoc app and DMG
        run: COMPOSITOR_SDK="$(xcrun --show-sdk-path)" bash scripts/build-macos15-dmg.sh
      - name: Upload local build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compositor-macos15-arm64
          path: dist/
          retention-days: 7
          if-no-files-found: warn
